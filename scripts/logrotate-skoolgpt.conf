# logrotate policy for the Skoolgpt cron/job logs (logs/*.log under the app
# checkout — every scripts/crontab line appends to one of these).
# Installed to /etc/logrotate.d/skoolgpt by scripts/server_hardening.sh.
# copytruncate: the cron jobs hold these open via `>>` redirection, so the
# file is truncated in place rather than renamed out from under them.
# Path is the same $APP as scripts/crontab / server_hardening.sh (logrotate
# has no variables).
/usr/share/nginx/aitutor.qlass.in/public_python_aios/logs/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

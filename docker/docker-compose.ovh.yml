services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: ../.env.production
    volumes: [qlass_pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    volumes: [qlass_redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../.env.production
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    # Bound to localhost only — a reverse proxy/load balancer in front
    # terminates TLS and is the only thing that should be publicly exposed
    # on 80/443. See README.md's "Deploying to OVH" section.
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  qlass_pg_data:
  qlass_redis_data:
